name: Android APK Build & Release Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish a GitHub Release with the built APK asset'
        required: false
        type: boolean
        default: false
      release_tag:
        description: 'Custom release tag (e.g. v1.0.0). Defaults to push tag or v1.0.0-run.<run_number>'
        required: false
        type: string
        default: ''
      web_app_url:
        description: 'Override WEB_APP_URL for the APK (defaults to production Control Center URL)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build & Verify Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Run Android Unit Tests
        run: |
          echo "======================================================="
          echo "Running Android Unit Tests (ActionValidatorTest)..."
          echo "======================================================="
          cd android
          ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build Debug Android APK
        env:
          CUSTOM_WEB_URL: ${{ github.event.inputs.web_app_url }}
        run: |
          echo "======================================================="
          echo "Compiling Android Application (assembleDebug)..."
          echo "======================================================="
          cd android
          BUILD_ARGS=""
          if [ -n "$CUSTOM_WEB_URL" ]; then
            echo "Applying custom WEB_APP_URL parameter: $CUSTOM_WEB_URL"
            BUILD_ARGS="-PWEB_APP_URL=$CUSTOM_WEB_URL"
          fi
          ./gradlew assembleDebug --no-daemon --stacktrace $BUILD_ARGS

      - name: Verify APK Generation & Integrity
        run: |
          echo "======================================================="
          echo "Verifying APK File Existence & Size..."
          echo "======================================================="
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::CRITICAL ERROR: Expected APK does not exist at path: $APK_PATH"
            exit 1
          fi

          FILE_SIZE=$(wc -c < "$APK_PATH")
          echo "Verified APK exists: $APK_PATH"
          echo "APK Size: $FILE_SIZE bytes"

          if [ "$FILE_SIZE" -lt 100000 ]; then
            echo "::error::CRITICAL ERROR: Generated APK is unexpectedly small ($FILE_SIZE bytes). Build may be corrupted."
            exit 1
          fi

          echo "APK_OUTPUT_PATH=$APK_PATH" >> $GITHUB_ENV
          echo "======================================================="
          echo "SUCCESS: Real APK generated and verified ($FILE_SIZE bytes)"
          echo "======================================================="

      - name: Upload APK as GitHub Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build-and-test
    if: >-
      (startsWith(github.ref, 'refs/tags/v') ||
       github.event.inputs.create_release == 'true' ||
       github.event.inputs.create_release == true)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Built APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-debug-apk
          path: build-artifacts

      - name: Verify Downloaded Artifact
        run: |
          if [ ! -f "build-artifacts/app-debug.apk" ]; then
            echo "::error::Downloaded artifact app-debug.apk not found!"
            exit 1
          fi
          echo "Artifact verified: $(ls -lh build-artifacts/app-debug.apk)"

      - name: Resolve Release Tag & Prepare Formatted APK
        id: release_info
        run: |
          # Determine release tag name
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          elif [ -n "${{ github.event.inputs.release_tag }}" ]; then
            TAG_NAME="${{ github.event.inputs.release_tag }}"
          else
            TAG_NAME="v1.0.0-run.${{ github.run_number }}"
          fi

          RELEASE_APK="DroidAutomate-Android-${TAG_NAME}.apk"
          cp "build-artifacts/app-debug.apk" "./${RELEASE_APK}"

          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "apk_filename=${RELEASE_APK}" >> $GITHUB_OUTPUT
          echo "Prepared release asset: ${RELEASE_APK} (Tag: ${TAG_NAME})"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          name: "DroidAutomate Assistant ${{ steps.release_info.outputs.tag_name }}"
          body: |
            ## DroidAutomate Android AI Automation Assistant - ${{ steps.release_info.outputs.tag_name }}

            ### 📦 Release Artifact
            - **`${{ steps.release_info.outputs.apk_filename }}`**: Standalone native Android client APK.

            ### 🔒 Architecture & Security Verification
            - **Strict Security Flow:** AI decides WHAT -> ActionValidator decides WHETHER -> Android executes HOW.
            - **Zero Prohibited Commands:** Arbitrary shell, root (su), and ADB execution are permanently blocked.
            - **Zero Secrets In APK:** API keys (Gemini, etc.) remain strictly on the backend server and are never bundled into the APK.
            - **Allowlist Enforced:** Only the 12 allowlisted system intents and device control APIs are permissible.
            - **Automated Validation:** Verified through unit testing and Gradle automated build.
          files: |
            ${{ steps.release_info.outputs.apk_filename }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
