name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build, Verify and Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Verify APK package, alignment and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          OUT="UniversalAndroidBuilder.apk"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"

          test -s "$APK"
          cp "$APK" "$OUT"

          echo "== ZIP integrity =="
          unzip -t "$OUT" >/dev/null

          echo "== ZIP alignment =="
          "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 "$OUT"

          echo "== APK signature =="
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$OUT"

          echo "== APK manifest/badging =="
          BADGING="$("$BUILD_TOOLS/aapt2" dump badging "$OUT")"
          echo "$BADGING"
          grep -F "package: name='com.droidautomate.assistant' versionCode='29' versionName='1.0.29'" <<<"$BADGING"
          grep -F "sdkVersion:'26'" <<<"$BADGING"
          grep -F "targetSdkVersion:'33'" <<<"$BADGING"
          grep -F "application-label:'Android AI Assistant'" <<<"$BADGING"
          grep -F "application-icon:" <<<"$BADGING"

          echo "== Forbidden Android 14-only specialUse entries =="
          if "$BUILD_TOOLS/aapt2" dump xmltree "$OUT" AndroidManifest.xml | grep -E "FOREGROUND_SERVICE_SPECIAL_USE|specialUse|PROPERTY_SPECIAL_USE_FGS_SUBTYPE"; then
            echo "ERROR: Android 14-only specialUse manifest entry is present"
            exit 1
          fi

          echo "== APK summary =="
          echo "APK verified: $OUT"
          echo "APK size: $(stat -c%s "$OUT") bytes"
          sha256sum "$OUT" | tee UniversalAndroidBuilder.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-installable-apk
          path: |
            UniversalAndroidBuilder.apk
            UniversalAndroidBuilder.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct-download GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-v${{ github.run_number }}"
          gh release create "$TAG" \
            UniversalAndroidBuilder.apk \
            UniversalAndroidBuilder.apk.sha256 \
            --title "Universal Android Builder APK $TAG" \
            --notes "Installable APK built from main, verified for package metadata, ZIP alignment and Android APK signature before publication."
