name: Android APK Build & Release Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish a GitHub Release with the built APK asset'
        required: false
        type: boolean
        default: false
      release_tag:
        description: 'Custom release tag (e.g. v1.0.0). Defaults to push tag or v1.0.0-run.<run_number>'
        required: false
        type: string
        default: ''
      web_app_url:
        description: 'Override WEB_APP_URL for the APK (defaults to production Control Center URL)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build & Verify Web + Android
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Web Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-production-build
          path: dist
          if-no-files-found: error
          retention-days: 14

      - name: Run Web Typecheck
        run: npm run lint

      - name: Set up Java JDK (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Run Android Unit Tests
        run: |
          cd android
          ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build Debug Android APK
        env:
          CUSTOM_WEB_URL: ${{ github.event.inputs.web_app_url }}
        run: |
          cd android
          BUILD_ARGS=""
          if [ -n "$CUSTOM_WEB_URL" ]; then
            echo "Applying custom WEB_APP_URL parameter: $CUSTOM_WEB_URL"
            BUILD_ARGS="-PWEB_APP_URL=$CUSTOM_WEB_URL"
          fi
          ./gradlew assembleDebug --no-daemon --stacktrace $BUILD_ARGS

      - name: Verify APK Generation & Integrity
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::Expected APK does not exist at $APK_PATH"
            exit 1
          fi
          FILE_SIZE=$(wc -c < "$APK_PATH")
          if [ "$FILE_SIZE" -lt 100000 ]; then
            echo "::error::Generated APK is unexpectedly small ($FILE_SIZE bytes)"
            exit 1
          fi
          echo "Verified APK: $APK_PATH ($FILE_SIZE bytes)"

      - name: Upload APK as GitHub Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build-and-test
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      startsWith(github.ref, 'refs/tags/v') ||
      github.event.inputs.create_release == 'true' ||
      github.event.inputs.create_release == true
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Built APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-debug-apk
          path: build-artifacts

      - name: Verify Downloaded Artifact
        run: |
          if [ ! -f "build-artifacts/app-debug.apk" ]; then
            echo "::error::Downloaded app-debug.apk not found"
            exit 1
          fi

      - name: Resolve Release Tag & Prepare APK
        id: release_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          elif [ -n "${{ github.event.inputs.release_tag }}" ]; then
            TAG_NAME="${{ github.event.inputs.release_tag }}"
          else
            TAG_NAME="v1.0.0-run.${{ github.run_number }}"
          fi

          RELEASE_APK="DroidAutomate-Android-${TAG_NAME}.apk"
          cp "build-artifacts/app-debug.apk" "./${RELEASE_APK}"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "apk_filename=${RELEASE_APK}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          name: "DroidAutomate Assistant ${{ steps.release_info.outputs.tag_name }}"
          body: |
            ## DroidAutomate Android AI Automation Assistant

            This release was generated automatically from the `main` branch after web build, typecheck, Android unit tests, and APK integrity verification succeeded.

            ### Security
            - AI decides WHAT -> ActionValidator decides WHETHER -> Android executes HOW.
            - Arbitrary shell, root/su, and ADB execution are blocked.
            - Gemini/API secrets are not bundled into the APK.
            - Only the allowlisted Android actions are executable.
          files: |
            ${{ steps.release_info.outputs.apk_filename }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
