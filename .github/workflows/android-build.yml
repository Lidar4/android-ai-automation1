name: Android APK Build & Release Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

env:
  GCP_PROJECT_ID: gen-lang-client-0604789111
  GCP_REGION: asia-southeast1
  CLOUD_RUN_SERVICE: droidautomate-assistant

permissions:
  contents: write

jobs:
  build-deploy:
    name: Build, Deploy Web + Verify Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Web Dependencies
        run: npm install --no-audit --no-fund

      - name: Build Web Application
        run: npm run build

      - name: Run Web Typecheck
        run: npm run lint

      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-production-build
          path: dist
          if-no-files-found: error
          retention-days: 14

      - name: Validate GCP service account secret
        shell: bash
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          test -n "$GCP_SA_KEY" || { echo "GCP_SA_KEY repository secret is missing"; exit 1; }

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Deploy Web + Backend to Cloud Run
        run: |
          gcloud run deploy "$CLOUD_RUN_SERVICE" \
            --source . \
            --region "$GCP_REGION" \
            --project "$GCP_PROJECT_ID" \
            --allow-unauthenticated \
            --port 3000

      - name: Read Cloud Run URL
        id: cloudrun
        run: |
          URL=$(gcloud run services describe "$CLOUD_RUN_SERVICE" \
            --region "$GCP_REGION" \
            --project "$GCP_PROJECT_ID" \
            --format='value(status.url)')
          test -n "$URL" || { echo "Cloud Run URL was not returned"; exit 1; }
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Cloud Run URL: $URL"

      - name: Health check
        run: |
          curl --fail --retry 5 --retry-delay 5 --retry-connrefused \
            "${{ steps.cloudrun.outputs.url }}/api/health"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Run Android tests
        working-directory: android
        run: ./gradlew test

      - name: Build Android APK
        working-directory: android
        run: ./gradlew assembleDebug -PWEB_APP_URL="${{ steps.cloudrun.outputs.url }}"

      - name: Verify APK
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK" || { echo "APK was not produced"; exit 1; }
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build-deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: android-debug-apk
          path: release-assets

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Android APK Build ${{ github.run_number }}
          generate_release_notes: true
          files: release-assets/app-debug.apk
