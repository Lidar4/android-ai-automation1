name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build, Verify and Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Verify APK is installable and signed
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          OUT="UniversalAndroidBuilder.apk"

          test -s "$APK"
          cp "$APK" "$OUT"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$OUT"

          echo "APK verified: $OUT"
          echo "APK size: $(stat -c%s "$OUT") bytes"
          sha256sum "$OUT" | tee UniversalAndroidBuilder.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-installable-apk
          path: |
            UniversalAndroidBuilder.apk
            UniversalAndroidBuilder.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct-download GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-v${{ github.run_number }}"
          gh release create "$TAG" \
            UniversalAndroidBuilder.apk \
            UniversalAndroidBuilder.apk.sha256 \
            --title "Universal Android Builder APK $TAG" \
            --notes "Installable APK built from main, verified with Android apksigner, and published as a direct APK release asset."
